<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Motion</title>
    <script type="text/javascript">
      // GitHub Pages serves this for any unmatched path (e.g. a direct link
      // or refresh on /Motion/home). It re-encodes the path into a query
      // string and redirects to the app root, where the script in index.html
      // decodes it back via history.replaceState before React Router reads
      // the URL. pathSegmentsToKeep=1 keeps the /Motion base segment.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
